# Publications, newest first. Each entry:
#   title:    put it in "double quotes" (titles often contain colons or apostrophes)
#   authors:  one string, exactly as it should print. "*" marks the corresponding author,
#             "(α–β)" marks alphabetical order. Group members and alumni (from members.yml
#             and alumni.yml) are underlined automatically.
#   year:     used to group the Publications page
#   type:     preprint | conference | journal   (drives the chip and the filter buttons)
#   venue:    short bold name, e.g. "ICML 2026" or "Mathematical Programming"
#   detail:   optional grey text after the venue (full name, volume/pages, awards)
#   links:    list of {label, url}; the first one is used as the title link.
#             Local files are written as "/file.pdf" (they live at the repository root).
#   featured: true  → shown under "Recent papers" on the Home page (first three)
#   conference: optional {venue, detail, links} for a conference version of a journal paper;
#             it is shown on its own line under the journal line.
#   awards:   optional list of {text, url, source}; each item is shown in bold on its own line
#             under the paper, with the url as a small "source" link next to it (url/source optional).

