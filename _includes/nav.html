<header class="site-header">
  <div class="container header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}"><img class="site-logo" src="{{ '/assets/img/snu-emblem.png' | relative_url }}" alt="" width="42" height="42"><span class="site-name-text">{{ site.title }}</span></a>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.nav %}{% if item.url == page.url or page.layout == 'course' and item.url == '/teaching/' %}<a class="active" aria-current="page" href="{{ item.url | relative_url }}">{{ item.title }}</a>{% else %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endif %}
      {% endfor %}
    </nav>
  </div>
</header>
<script>
(function () {
  var nav = document.querySelector('.site-nav'), active = nav && nav.querySelector('a.active');
  if (active && nav.scrollWidth > nav.clientWidth) { nav.scrollLeft = Math.max(0, active.offsetLeft - nav.offsetLeft - 20); }
})();
</script>
