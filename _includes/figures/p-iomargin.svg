<svg viewBox="0 0 240 150" role="img" aria-label="An eye diagram with its margin window highlighted, next to a column of register switches">
<defs><linearGradient id="p-iomargin-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient><marker id="p-iomargin-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent-dark)"/></marker></defs><rect width="240" height="150" fill="url(#p-iomargin-bg)"/><g fill="none" style="stroke:var(--accent)" stroke-opacity="0.3" stroke-width="1.2">{% for d in (0..2) %}{% assign o = d | times: 5 | minus: 5 %}<path transform="translate({{ o }} 0)" d="M18 35 C 36 35, 44 115, 62 115 H104 C 122 115, 130 35, 148 35"/><path transform="translate({{ o }} 0)" d="M18 115 C 36 115, 44 35, 62 35 H104 C 122 35, 130 115, 148 115"/>{% endfor %}</g>
<g fill="none" style="stroke:var(--accent-dark)" stroke-width="2"><path d="M18 35 C 36 35, 44 115, 62 115 H104 C 122 115, 130 35, 148 35"/><path d="M18 115 C 36 115, 44 35, 62 35 H104 C 122 35, 130 115, 148 115"/></g>
<rect x="62" y="52" width="42" height="46" rx="4" style="fill:var(--accent);stroke:var(--accent-dark)" fill-opacity="0.22" stroke-width="1.4" stroke-dasharray="4 2"/>
<g style="stroke:var(--accent-dark)" stroke-width="1.2" marker-start="url(#p-iomargin-ah)" marker-end="url(#p-iomargin-ah)"><line x1="67" y1="75" x2="99" y2="75"/><line x1="83" y1="57" x2="83" y2="93"/></g>
{% assign on = "1,0,1,1,0" | split: "," %}{% for v in on %}{% assign y = forloop.index0 | times: 22 | plus: 24 %}<rect x="178" y="{{ y }}" width="38" height="14" rx="7" style="fill:var(--accent{% if v == '1' %}-dark{% else %}-line{% endif %})"/><circle cx="{% if v == '1' %}209{% else %}185{% endif %}" cy="{{ y | plus: 7 }}" r="5" style="fill:var(--surface)"/>{% endfor %}
<path d="M172 75 H158" fill="none" style="stroke:var(--accent-dark)" stroke-width="1.4" marker-end="url(#p-iomargin-ah)"/>
</svg>
