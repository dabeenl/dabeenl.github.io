<svg viewBox="0 0 120 80" role="img" aria-label="Integer points, the hull of the feasible ones, and a cutting plane">
<defs><linearGradient id="t-ie631-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient></defs><rect width="120" height="80" fill="url(#t-ie631-bg)"/><polygon points="22,62 100,58 106,30 70,6 26,20" style="fill:var(--accent);stroke:var(--accent-line)" fill-opacity="0.1" stroke-width="1.1"/>
<polygon points="32,54 96,54 96,26 64,12 32,26" style="fill:var(--accent);stroke:var(--accent-dark)" fill-opacity="0.2" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="44" y1="3.25" x2="116" y2="34.75" style="stroke:var(--accent-dark)" stroke-width="1.2" stroke-dasharray="4 3"/>
<g style="fill:var(--muted)">{% for j in (0..4) %}{% for i in (0..6) %}<circle cx="{{ i | times: 16 | plus: 16 }}" cy="{{ j | times: 14 | plus: 12 }}" r="1.5"/>{% endfor %}{% endfor %}</g>
</svg>
