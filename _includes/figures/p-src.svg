<svg viewBox="0 0 240 150" role="img" aria-label="A lattice with basis vectors and a short vector, next to a shield with a keyhole">
<defs><linearGradient id="p-src-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient><marker id="p-src-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent-dark)"/></marker></defs><rect width="240" height="150" fill="url(#p-src-bg)"/><g style="stroke:var(--accent)" stroke-opacity="0.22" stroke-width="0.9">{% for j in (0..3) %}<line x1="{{ j | times: 14 | plus: 36 }}" y1="{{ j | times: -30 | plus: 131 }}" x2="{{ j | times: 14 | plus: 138 }}" y2="{{ j | times: -30 | plus: 113 }}"/>{% endfor %}{% for i in (0..3) %}<line x1="{{ i | times: 34 | plus: 36 }}" y1="{{ i | times: -6 | plus: 131 }}" x2="{{ i | times: 34 | plus: 78 }}" y2="{{ i | times: -6 | plus: 41 }}"/>{% endfor %}</g>
<g style="fill:var(--accent)" fill-opacity="0.75">{% for j in (0..3) %}{% assign jx = j | times: 14 %}{% assign jy = j | times: 30 %}{% for i in (0..3) %}<circle cx="{{ i | times: 34 | plus: 36 | plus: jx }}" cy="{{ i | times: -6 | plus: 131 | minus: jy }}" r="2.6"/>{% endfor %}{% endfor %}</g>
<circle cx="84" cy="95" r="31.5" fill="none" style="stroke:var(--accent)" stroke-width="1" stroke-dasharray="3 3"/>
<g fill="none" style="stroke:var(--accent)" stroke-width="1.8" marker-end="url(#p-src-ah)"><line x1="84" y1="95" x2="116" y2="89.4"/><line x1="84" y1="95" x2="97" y2="67"/></g>
<line x1="84" y1="95" x2="65.3" y2="72.6" style="stroke:var(--accent-dark)" stroke-width="2.6" marker-end="url(#p-src-ah)"/>
<circle cx="84" cy="95" r="4" style="fill:var(--accent-dark)"/>
<path d="M200 60 l26 10 v22 c0 19 -11 31 -26 38 c-15 -7 -26 -19 -26 -38 v-22 z" style="fill:var(--accent-dark)"/><path d="M200 67 l20 7.6 v17.4 c0 15 -8.5 24.5 -20 30.5 z" style="fill:var(--accent)" fill-opacity="0.55"/>
<circle cx="200" cy="88" r="6" style="fill:var(--surface)"/><path d="M197 90 h6 l2 16 h-10 z" style="fill:var(--surface)"/>
<path d="M150 40 C 170 30, 186 36, 196 54" fill="none" style="stroke:var(--accent-dark)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#p-src-ah)"/>
</svg>
