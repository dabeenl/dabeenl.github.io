<svg viewBox="0 0 240 150" role="img" aria-label="A grid of register bits with one combination selected, a score chart, and a search tree with the best branch highlighted">
<defs><linearGradient id="p-tmrs-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient><marker id="p-tmrs-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent-dark)"/></marker></defs><rect width="240" height="150" fill="url(#p-tmrs-bg)"/><g>{% for j in (0..3) %}{% for i in (0..6) %}{% assign v = i | times: 3 | plus: j | times: 5 | modulo: 7 %}<rect x="{{ i | times: 17 | plus: 14 }}" y="{{ j | times: 17 | plus: 16 }}" width="13" height="13" rx="3" style="fill:var(--accent{% if v < 3 %}-dark{% endif %})" fill-opacity="{% if v < 3 %}0.95{% else %}0.18{% endif %}"/>{% endfor %}{% endfor %}</g>
<rect x="11" y="47" width="122" height="19" rx="5" fill="none" style="stroke:var(--accent-dark)" stroke-width="1.5" stroke-dasharray="4 2"/>
<g>{% assign hs = "14,22,18,30,12,40,26" | split: "," %}{% for h in hs %}{% assign hh = h | plus: 0 %}<rect x="{{ forloop.index0 | times: 17 | plus: 14 }}" y="{{ 136 | minus: hh }}" width="13" height="{{ hh }}" rx="2.5" style="fill:var(--accent{% if hh == 40 %}-dark{% endif %})" fill-opacity="{% if hh == 40 %}1{% else %}0.4{% endif %}"/>{% endfor %}</g>
<line x1="10" y1="137" x2="134" y2="137" style="stroke:var(--ink)" stroke-opacity="0.5" stroke-width="1"/>
<g fill="none" style="stroke:var(--accent)" stroke-opacity="0.45" stroke-width="1.1"><path d="M190 22 L166 56 M190 22 L214 56 M166 56 L154 90 M166 56 L178 90 M214 56 L202 90 M214 56 L226 90"/>{% for k in (0..3) %}<path d="M{{ k | times: 24 | plus: 154 }} 90 l-6 32 m6 -32 l6 32"/>{% endfor %}</g>
<polyline points="190,22 214,56 202,90 208,122" fill="none" style="stroke:var(--accent-dark)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<g style="fill:var(--surface);stroke:var(--accent)" stroke-width="1.3"><circle cx="166" cy="56" r="4.5"/><circle cx="154" cy="90" r="4"/><circle cx="178" cy="90" r="4"/><circle cx="226" cy="90" r="4"/>{% for k in (0..7) %}<circle cx="{{ k | times: 12 | plus: 148 }}" cy="122" r="3"/>{% endfor %}</g>
<g style="fill:var(--accent-dark)"><circle cx="190" cy="22" r="5.2"/><circle cx="214" cy="56" r="4.8"/><circle cx="202" cy="90" r="4.4"/></g><circle cx="208" cy="122" r="8" style="fill:var(--accent)" fill-opacity="0.25"/><circle cx="208" cy="122" r="4" style="fill:var(--accent-dark)"/>
</svg>
