<svg viewBox="0 0 240 150" role="img" aria-label="A token sequence feeding three stacked layers that carry waves of decreasing frequency">
<defs><linearGradient id="p-ssm-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient><marker id="p-ssm-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent-dark)"/></marker></defs><rect width="240" height="150" fill="url(#p-ssm-bg)"/><g style="fill:var(--surface);stroke:var(--accent-line)" stroke-width="1.1"><rect x="18" y="16" width="204" height="26" rx="8"/><rect x="18" y="52" width="204" height="26" rx="8"/><rect x="18" y="88" width="204" height="26" rx="8"/></g>
<path d="M24 29 q24 -16 48 0 t48 0 t48 0 t48 0" fill="none" style="stroke:var(--accent-dark)" stroke-width="2.2" stroke-linecap="round"/>
<path d="M24 65 q12 -14 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0" fill="none" style="stroke:var(--accent)" stroke-width="1.9" stroke-linecap="round"/>
<path d="M24 101 q6 -12 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0" fill="none" style="stroke:var(--accent)" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round"/>
<g style="stroke:var(--accent-dark)" stroke-width="1.3" marker-end="url(#p-ssm-ah)"><line x1="70" y1="88" x2="70" y2="80"/><line x1="120" y1="88" x2="120" y2="80"/><line x1="170" y1="88" x2="170" y2="80"/><line x1="95" y1="52" x2="95" y2="44"/><line x1="145" y1="52" x2="145" y2="44"/></g>
<g style="stroke:var(--accent-line)" stroke-width="1">{% for i in (0..7) %}<line x1="{{ i | times: 24 | plus: 36 }}" y1="126" x2="{{ i | times: 24 | plus: 36 }}" y2="114"/>{% endfor %}</g>
<g>{% for i in (0..7) %}{% assign m = i | modulo: 3 %}<rect x="{{ i | times: 24 | plus: 29 }}" y="126" width="14" height="14" rx="3.5" style="fill:var(--accent{% if m == 0 %}-dark{% endif %})" fill-opacity="{% if m == 2 %}0.35{% else %}0.9{% endif %}"/>{% endfor %}</g>
</svg>
