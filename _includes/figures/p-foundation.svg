<svg viewBox="0 0 240 150" role="img" aria-label="A central layered model connected to four problems: routing, scheduling, packing, and matching">
<defs><linearGradient id="p-foundation-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient><marker id="p-foundation-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent-dark)"/></marker></defs><rect width="240" height="150" fill="url(#p-foundation-bg)"/><g fill="none" style="stroke:var(--accent)" stroke-width="1.2" stroke-opacity="0.7"><path d="M66 38 C 86 46, 92 58, 100 66"/><path d="M174 38 C 154 46, 148 58, 140 66"/><path d="M66 112 C 86 104, 92 94, 100 86"/><path d="M174 112 C 154 104, 148 94, 140 86"/></g>
<g style="fill:var(--surface);stroke:var(--accent-line)" stroke-width="1"><rect x="10" y="12" width="58" height="46" rx="8"/><rect x="172" y="12" width="58" height="46" rx="8"/><rect x="10" y="92" width="58" height="46" rx="8"/><rect x="172" y="92" width="58" height="46" rx="8"/></g>
<polygon points="20,40 30,22 46,20 58,36 44,50" fill="none" style="stroke:var(--accent-dark)" stroke-width="1.5" stroke-linejoin="round"/><g style="fill:var(--accent-dark)"><circle cx="20" cy="40" r="2.6"/><circle cx="30" cy="22" r="2.6"/><circle cx="46" cy="20" r="2.6"/><circle cx="58" cy="36" r="2.6"/><circle cx="44" cy="50" r="2.6"/></g>
<g><rect x="180" y="20" width="22" height="7" rx="2" style="fill:var(--accent-dark)"/><rect x="204" y="20" width="16" height="7" rx="2" style="fill:var(--accent)" fill-opacity="0.5"/><rect x="180" y="31" width="12" height="7" rx="2" style="fill:var(--accent)" fill-opacity="0.5"/><rect x="194" y="31" width="28" height="7" rx="2" style="fill:var(--accent-dark)"/><rect x="186" y="42" width="18" height="7" rx="2" style="fill:var(--accent)"/><rect x="206" y="42" width="10" height="7" rx="2" style="fill:var(--accent)" fill-opacity="0.5"/></g>
<g><rect x="22" y="100" width="34" height="32" rx="2" fill="none" style="stroke:var(--accent-dark)" stroke-width="1.4"/><rect x="24" y="116" width="16" height="14" style="fill:var(--accent-dark)"/><rect x="41" y="122" width="13" height="8" style="fill:var(--accent)"/><rect x="41" y="110" width="13" height="11" style="fill:var(--accent)" fill-opacity="0.5"/><rect x="24" y="106" width="10" height="9" style="fill:var(--accent)" fill-opacity="0.75"/></g>
<g style="stroke:var(--accent)" stroke-opacity="0.35" stroke-width="1"><line x1="186" y1="104" x2="216" y2="116"/><line x1="186" y1="116" x2="216" y2="128"/><line x1="186" y1="128" x2="216" y2="104"/></g><g style="stroke:var(--accent-dark)" stroke-width="1.8"><line x1="186" y1="104" x2="216" y2="104"/><line x1="186" y1="116" x2="216" y2="128"/><line x1="186" y1="128" x2="216" y2="116"/></g>
<g style="fill:var(--accent-dark)"><circle cx="186" cy="104" r="3"/><circle cx="186" cy="116" r="3"/><circle cx="186" cy="128" r="3"/></g><g style="fill:var(--surface);stroke:var(--accent-dark)" stroke-width="1.4"><circle cx="216" cy="104" r="3"/><circle cx="216" cy="116" r="3"/><circle cx="216" cy="128" r="3"/></g>
<ellipse cx="120" cy="76" rx="40" ry="34" style="fill:var(--accent)" fill-opacity="0.13"/>
<g>{% for k in (0..3) %}<rect x="{{ k | times: 4 | plus: 90 }}" y="{{ k | times: 12 | plus: 52 }}" width="{{ k | times: -8 | plus: 60 }}" height="9" rx="4.5" style="fill:var(--accent-dark)" fill-opacity="{{ k | times: -0.18 | plus: 1 }}"/>{% endfor %}</g>
</svg>
