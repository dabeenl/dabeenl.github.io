<svg viewBox="0 0 240 150" role="img" aria-label="A formation of vehicles linked by communication lines flying toward a target, tracked by a ground station">
<defs><linearGradient id="p-swarm-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient><marker id="p-swarm-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent-dark)"/></marker></defs><rect width="240" height="150" fill="url(#p-swarm-bg)"/><g fill="none" style="stroke:var(--accent)" stroke-opacity="0.45" stroke-width="1.2"><path d="M20 106 a26 26 0 0 1 26 26"/><path d="M20 90 a42 42 0 0 1 42 42"/><path d="M20 74 a58 58 0 0 1 58 58"/></g>
<path d="M12 132 h22 l-4 -12 h-14 z" style="fill:var(--accent-dark)"/><line x1="23" y1="120" x2="31" y2="106" style="stroke:var(--accent-dark)" stroke-width="2" stroke-linecap="round"/>
<path d="M50 112 C 86 108, 104 98, 128 86" fill="none" style="stroke:var(--accent-dark)" stroke-width="1.2" stroke-dasharray="4 3"/>
<g fill="none" style="stroke:var(--accent)" stroke-width="1" stroke-dasharray="2 3"><line x1="160" y1="52" x2="132" y2="68"/><line x1="160" y1="52" x2="188" y2="68"/><line x1="132" y1="68" x2="104" y2="86"/><line x1="188" y1="68" x2="214" y2="86"/><line x1="132" y1="68" x2="188" y2="68"/><line x1="132" y1="68" x2="160" y2="90"/><line x1="188" y1="68" x2="160" y2="90"/></g>
<g style="fill:var(--accent-dark)">{% assign xs = "160,132,188,104,214,160" | split: "," %}{% assign ys = "52,68,68,86,86,90" | split: "," %}{% for x in xs %}<path transform="translate({{ x }} {{ ys[forloop.index0] }})" d="M0 -9 L7 7 L0 3 L-7 7 Z"/>{% endfor %}</g>
<circle cx="160" cy="52" r="13" fill="none" style="stroke:var(--accent)" stroke-opacity="0.5" stroke-width="1"/>
<g fill="none" style="stroke:var(--accent-dark)" stroke-width="1.2"><circle cx="160" cy="18" r="9"/><circle cx="160" cy="18" r="4"/><line x1="160" y1="5" x2="160" y2="31"/><line x1="147" y1="18" x2="173" y2="18"/></g>
<line x1="160" y1="40" x2="160" y2="30" style="stroke:var(--accent-dark)" stroke-width="1.3" marker-end="url(#p-swarm-ah)"/>
</svg>
