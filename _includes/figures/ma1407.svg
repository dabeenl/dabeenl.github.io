<svg viewBox="0 0 120 80" role="img" aria-label="A small layered network with one highlighted path">
<defs><linearGradient id="t-ma1407-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient></defs><rect width="120" height="80" fill="url(#t-ma1407-bg)"/><g style="stroke:var(--accent)" stroke-opacity="0.25" stroke-width="0.8">{% for i in (0..2) %}{% for j in (0..3) %}<line x1="22" y1="{{ i | times: 20 | plus: 20 }}" x2="60" y2="{{ j | times: 17 | plus: 14 }}"/>{% endfor %}{% endfor %}{% for i in (0..3) %}{% for j in (0..1) %}<line x1="60" y1="{{ i | times: 17 | plus: 14 }}" x2="98" y2="{{ j | times: 28 | plus: 26 }}"/>{% endfor %}{% endfor %}</g>
<polyline points="22,40 60,31 98,26" fill="none" style="stroke:var(--accent-dark)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<g style="fill:var(--surface);stroke:var(--accent)" stroke-width="1.2">{% for i in (0..2) %}<circle cx="22" cy="{{ i | times: 20 | plus: 20 }}" r="4.6"/>{% endfor %}{% for i in (0..3) %}<circle cx="60" cy="{{ i | times: 17 | plus: 14 }}" r="4.6"/>{% endfor %}<circle cx="98" cy="26" r="5.2"/><circle cx="98" cy="54" r="5.2"/></g>
<circle cx="98" cy="26" r="9.5" style="fill:var(--accent)" fill-opacity="0.2"/><g style="fill:var(--accent-dark)"><circle cx="22" cy="40" r="4.6"/><circle cx="60" cy="31" r="4.6"/><circle cx="98" cy="26" r="5.2"/></g>
</svg>
