<svg viewBox="0 0 240 150" role="img" aria-label="A generative model emitting digital waveforms that drive a memory chip">
<defs><linearGradient id="p-jedec-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient><marker id="p-jedec-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent-dark)"/></marker></defs><rect width="240" height="150" fill="url(#p-jedec-bg)"/><rect x="10" y="40" width="50" height="70" rx="10" style="fill:var(--accent-dark)"/>
