<svg viewBox="0 0 240 150" role="img" aria-label="A black box feeding a neural model that outputs a combinatorial solution, with a feedback loop">
<defs><linearGradient id="p-blackbox-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient><marker id="p-blackbox-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent-dark)"/></marker></defs><rect width="240" height="150" fill="url(#p-blackbox-bg)"/><rect x="14" y="34" width="56" height="56" rx="9" style="fill:var(--ink)"/><text x="42" y="67" text-anchor="middle" font-size="15" font-style="italic" font-family="Georgia, 'Times New Roman', serif" style="fill:var(--surface)">f(x)</text>
<text x="42" y="28" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">black box</text>
<g style="stroke:var(--accent)" stroke-opacity="0.3" stroke-width="0.8">{% for i in (0..2) %}{% for j in (0..3) %}<line x1="98" y1="{{ i | times: 20 | plus: 42 }}" x2="120" y2="{{ j | times: 16 | plus: 38 }}"/>{% endfor %}{% endfor %}{% for i in (0..3) %}{% for j in (0..2) %}<line x1="120" y1="{{ i | times: 16 | plus: 38 }}" x2="142" y2="{{ j | times: 20 | plus: 42 }}"/>{% endfor %}{% endfor %}</g>
<g style="fill:var(--surface);stroke:var(--accent)" stroke-width="1.2">{% for i in (0..2) %}<circle cx="98" cy="{{ i | times: 20 | plus: 42 }}" r="4"/><circle cx="142" cy="{{ i | times: 20 | plus: 42 }}" r="4"/>{% endfor %}{% for i in (0..3) %}<circle cx="120" cy="{{ i | times: 16 | plus: 38 }}" r="4"/>{% endfor %}</g>
<g style="stroke:var(--accent-dark)" stroke-width="1.6" marker-end="url(#p-blackbox-ah)"><line x1="72" y1="62" x2="88" y2="62"/><line x1="150" y1="62" x2="166" y2="62"/></g>
<g style="stroke:var(--accent)" stroke-opacity="0.35" stroke-width="1"><line x1="178" y1="44" x2="202" y2="36"/><line x1="178" y1="44" x2="186" y2="76"/><line x1="202" y1="36" x2="224" y2="56"/><line x1="186" y1="76" x2="214" y2="86"/><line x1="224" y1="56" x2="214" y2="86"/><line x1="202" y1="36" x2="186" y2="76"/><line x1="202" y1="36" x2="214" y2="86"/></g>
<polyline points="178,44 202,36 214,86 186,76" fill="none" style="stroke:var(--accent-dark)" stroke-width="2.2" stroke-linejoin="round"/>
<g style="fill:var(--accent-dark)"><circle cx="178" cy="44" r="4.2"/><circle cx="202" cy="36" r="4.2"/><circle cx="214" cy="86" r="4.2"/><circle cx="186" cy="76" r="4.2"/></g><circle cx="224" cy="56" r="4.2" style="fill:var(--surface);stroke:var(--accent)" stroke-width="1.4"/>
<path d="M200 98 C 200 140, 42 140, 42 96" fill="none" style="stroke:var(--accent-dark)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#p-blackbox-ah)"/>
<text x="121" y="114" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">query and evaluate</text>
</svg>
