<div class="figs" aria-label="Research themes">
  <figure class="fig">
    <svg viewBox="0 0 200 130" role="img" aria-label="Level sets of an objective with a smooth descent path reaching the minimizer next to a constraint">
      <defs>
        <linearGradient id="fig-bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient>
        <linearGradient id="fig-path1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-line)"/><stop offset="1" style="stop-color:var(--accent-dark)"/></linearGradient>
      </defs>
      <rect width="200" height="130" fill="url(#fig-bg1)"/>
      <g transform="rotate(-18 120 70)" style="fill:var(--accent);stroke:var(--accent)" stroke-opacity="0.35" stroke-width="0.8">
        <ellipse cx="120" cy="70" rx="92" ry="52" fill-opacity="0.05"/><ellipse cx="120" cy="70" rx="72" ry="40" fill-opacity="0.07"/><ellipse cx="120" cy="70" rx="53" ry="29" fill-opacity="0.09"/><ellipse cx="120" cy="70" rx="35" ry="19" fill-opacity="0.12"/><ellipse cx="120" cy="70" rx="18" ry="10" fill-opacity="0.18"/>
      </g>
      <polygon points="0,130 0,84 96,130" style="fill:var(--accent-dark)" fill-opacity="0.12"/>
      <line x1="0" y1="84" x2="96" y2="130" style="stroke:var(--accent-dark)" stroke-width="1.4" stroke-dasharray="5 3"/>
      <path d="M22 24 C 54 24, 52 66, 80 60 S 98 44, 106 62 S 112 74, 120 70" fill="none" stroke="url(#fig-path1)" stroke-width="2.6" stroke-linecap="round"/>
      <g style="fill:var(--accent)"><circle cx="22" cy="24" r="3.2"/><circle cx="53" cy="44" r="2.4"/><circle cx="80" cy="60" r="2.4"/><circle cx="100" cy="50" r="2.4"/><circle cx="110" cy="68" r="2.4"/></g>
      <circle cx="120" cy="70" r="11" style="fill:var(--accent)" fill-opacity="0.18"/><circle cx="120" cy="70" r="6.5" style="fill:var(--accent)" fill-opacity="0.3"/><circle cx="120" cy="70" r="3.6" style="fill:var(--accent-dark)"/>
    </svg>
    <figcaption><strong>Optimization</strong><span>(discrete, continuous, stochastic)</span></figcaption>
  </figure>

  <figure class="fig">
    <svg viewBox="0 0 200 130" role="img" aria-label="Sublinear regret curve with a confidence band and sample paths under a linear reference">
      <defs>
        <linearGradient id="fig-bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--accent-tint)"/></linearGradient>
        <linearGradient id="fig-band2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent)" stop-opacity="0.05"/><stop offset="1" style="stop-color:var(--accent)" stop-opacity="0.3"/></linearGradient>
      </defs>
      <rect width="200" height="130" fill="url(#fig-bg2)"/>
      <g style="stroke:var(--accent-line)" stroke-width="0.7" stroke-dasharray="2 4"><line x1="26" y1="30" x2="188" y2="30"/><line x1="26" y1="57" x2="188" y2="57"/><line x1="26" y1="84" x2="188" y2="84"/></g>
      <line x1="26" y1="112" x2="170" y2="14" style="stroke:var(--muted)" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="5 4"/>
      <path d="M26 112 C 40 52, 96 34, 184 22 L184 58 C 100 68, 50 84, 26 112 Z" fill="url(#fig-band2)"/>
      <g fill="none" style="stroke:var(--accent)" stroke-opacity="0.4" stroke-width="0.9" stroke-linejoin="round">
        <polyline points="26,112 40,88 54,80 68,66 82,64 96,56 110,55 124,48 138,49 152,43 166,44 184,38"/>
        <polyline points="26,112 40,96 54,82 68,76 82,66 96,64 110,57 124,56 138,50 152,50 166,45 184,43"/>
      </g>
      <path d="M26 112 C 44 66, 96 50, 184 40" fill="none" style="stroke:var(--accent-dark)" stroke-width="2.6" stroke-linecap="round"/>
      <polyline fill="none" style="stroke:var(--ink)" stroke-opacity="0.55" stroke-width="1.2" points="26,12 26,112 190,112"/>
      <circle cx="184" cy="40" r="7" style="fill:var(--accent)" fill-opacity="0.22"/><circle cx="184" cy="40" r="3.2" style="fill:var(--accent-dark)"/>
      <text x="188" y="124" text-anchor="end" font-size="9.5" style="fill:var(--muted)">rounds T</text>
      <text x="31" y="19" font-size="9.5" style="fill:var(--muted)">regret</text>
    </svg>
    <figcaption><strong>Learning algorithms</strong><span>(bandits, online learning, reinforcement learning)</span></figcaption>
  </figure>

  <figure class="fig">
    <svg viewBox="0 0 200 130" role="img" aria-label="A layered neural network with one activated path highlighted">
      <defs>
        <linearGradient id="fig-bg3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient>
        <radialGradient id="fig-node3" cx="0.35" cy="0.3" r="0.8"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--accent-line)"/></radialGradient>
      </defs>
      <rect width="200" height="130" fill="url(#fig-bg3)"/>
      <g style="stroke:var(--accent)" stroke-opacity="0.2" stroke-width="0.8">
        {% for i in (0..3) %}{% for j in (0..4) %}<line x1="34" y1="{{ i | times: 26 | plus: 26 }}" x2="82" y2="{{ j | times: 24 | plus: 17 }}"/>{% endfor %}{% endfor %}
        {% for i in (0..4) %}{% for j in (0..4) %}<line x1="82" y1="{{ i | times: 24 | plus: 17 }}" x2="130" y2="{{ j | times: 24 | plus: 17 }}"/>{% endfor %}{% endfor %}
        {% for i in (0..4) %}{% for j in (0..1) %}<line x1="130" y1="{{ i | times: 24 | plus: 17 }}" x2="172" y2="{{ j | times: 30 | plus: 50 }}"/>{% endfor %}{% endfor %}
      </g>
      <polyline points="34,52 82,65 130,41 172,50" fill="none" style="stroke:var(--accent-dark)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      <g fill="url(#fig-node3)" style="stroke:var(--accent)" stroke-width="1.2">
        {% for i in (0..3) %}<circle cx="34" cy="{{ i | times: 26 | plus: 26 }}" r="5.5"/>{% endfor %}
        {% for i in (0..4) %}<circle cx="82" cy="{{ i | times: 24 | plus: 17 }}" r="5.5"/><circle cx="130" cy="{{ i | times: 24 | plus: 17 }}" r="5.5"/>{% endfor %}
        <circle cx="172" cy="50" r="6.5"/><circle cx="172" cy="80" r="6.5"/>
      </g>
      <circle cx="172" cy="50" r="12" style="fill:var(--accent)" fill-opacity="0.2"/>
      <g style="fill:var(--accent-dark)"><circle cx="34" cy="52" r="5.5"/><circle cx="82" cy="65" r="5.5"/><circle cx="130" cy="41" r="5.5"/><circle cx="172" cy="50" r="6.5"/></g>
    </svg>
    <figcaption><strong>AI</strong><span>(mathematical foundations, AI for mathematics)</span></figcaption>
  </figure>

  <figure class="fig">
    <svg viewBox="0 0 200 130" role="img" aria-label="Four icons: a gear for production, a route for logistics, a heartbeat for healthcare, and a chip for semiconductors">
      <defs>
        <linearGradient id="fig-bg4" x1="1" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent-tint)"/><stop offset="1" style="stop-color:var(--surface)"/></linearGradient>
      </defs>
      <rect width="200" height="130" fill="url(#fig-bg4)"/>
      <g style="fill:var(--surface);stroke:var(--accent-line)" stroke-width="1"><rect x="14" y="10" width="80" height="50" rx="9"/><rect x="106" y="10" width="80" height="50" rx="9"/><rect x="14" y="70" width="80" height="50" rx="9"/><rect x="106" y="70" width="80" height="50" rx="9"/></g>
      <circle cx="54" cy="35" r="13" fill="none" style="stroke:var(--accent)" stroke-width="6" stroke-dasharray="5.1 5.1"/><circle cx="54" cy="35" r="10" style="fill:var(--accent)"/><circle cx="54" cy="35" r="4.2" style="fill:var(--surface)"/>
      <path d="M122 47 C 136 47, 132 27, 146 30 S 156 46, 168 37" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/><circle cx="122" cy="47" r="3.4" style="fill:var(--accent-dark)"/>
      <path d="M168 38 c-5 -7 -7.5 -10 -7.5 -14 a7.5 7.5 0 0 1 15 0 c0 4 -2.5 7 -7.5 14z" style="fill:var(--accent-dark)"/><circle cx="168" cy="24" r="2.8" style="fill:var(--surface)"/>
      <polyline points="24,97 40,97 45,88 50,108 56,79 62,103 67,97 84,97" fill="none" style="stroke:var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      <g style="stroke:var(--accent)" stroke-width="2" stroke-linecap="round">
        {% for k in (0..2) %}<line x1="{{ k | times: 8 | plus: 138 }}" y1="77" x2="{{ k | times: 8 | plus: 138 }}" y2="82"/><line x1="{{ k | times: 8 | plus: 138 }}" y1="108" x2="{{ k | times: 8 | plus: 138 }}" y2="113"/><line x1="128" y1="{{ k | times: 8 | plus: 87 }}" x2="133" y2="{{ k | times: 8 | plus: 87 }}"/><line x1="159" y1="{{ k | times: 8 | plus: 87 }}" x2="164" y2="{{ k | times: 8 | plus: 87 }}"/>{% endfor %}
      </g>
      <rect x="133" y="82" width="26" height="26" rx="4" style="fill:var(--accent-dark)"/><rect x="139.5" y="88.5" width="13" height="13" rx="2" style="fill:var(--accent-tint)"/>
    </svg>
    <figcaption><strong>Applications</strong><span>(production, logistics, healthcare, semiconductors)</span></figcaption>
  </figure>
</div>
