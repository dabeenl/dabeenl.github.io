<div class="figs" aria-label="Research themes">
  <figure class="fig">
    <svg viewBox="0 0 160 110" role="img" aria-label="Contour lines of a function with a descent path converging to the minimizer">
      <g fill="none" stroke="var(--accent-line)" stroke-width="1.2" transform="rotate(-20 95 58)">
        <ellipse cx="95" cy="58" rx="62" ry="35"/><ellipse cx="95" cy="58" rx="45" ry="25"/><ellipse cx="95" cy="58" rx="29" ry="16"/><ellipse cx="95" cy="58" rx="13" ry="7"/>
      </g>
      <polyline fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" points="20,24 49,50 62,38 78,57 87,49 95,58"/>
      <g fill="var(--accent)"><circle cx="20" cy="24" r="2.6"/><circle cx="49" cy="50" r="2.2"/><circle cx="62" cy="38" r="2.2"/><circle cx="78" cy="57" r="2.2"/><circle cx="87" cy="49" r="2.2"/><circle cx="95" cy="58" r="3.2"/></g>
    </svg>
    <figcaption>Continuous optimization</figcaption>
  </figure>
  <figure class="fig">
    <svg viewBox="0 0 160 110" role="img" aria-label="A polytope, the convex hull of its integer points, and a cutting plane">
      <polygon points="30,88 128,80 134,42 88,8 34,30" fill="var(--accent-tint)" stroke="var(--accent-line)" stroke-width="1.2"/>
      <polygon points="40,75 120,75 120,35 80,15 40,35" fill="var(--accent-line)" fill-opacity="0.55" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="62" y1="6" x2="150" y2="50" stroke="var(--accent-dark)" stroke-width="1.4" stroke-dasharray="4 3"/>
      <g fill="var(--muted)">
        {% for j in (0..4) %}{% for i in (0..6) %}<circle cx="{{ i | times: 20 | plus: 20 }}" cy="{{ j | times: 20 | plus: 15 }}" r="1.7"/>{% endfor %}{% endfor %}
      </g>
    </svg>
    <figcaption>Integer programming</figcaption>
  </figure>
  <figure class="fig">
    <svg viewBox="0 0 160 110" role="img" aria-label="A sublinear regret curve lying below a linear one">
      <polyline fill="none" stroke="var(--muted)" stroke-width="1.2" points="20,10 20,94 150,94"/>
      <line x1="20" y1="94" x2="142" y2="16" stroke="var(--accent-line)" stroke-width="1.4" stroke-dasharray="4 3"/>
      <path d="M20 94 C 34 58, 80 44, 146 36" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <g fill="var(--accent)"><circle cx="50" cy="63" r="2.2"/><circle cx="84" cy="49" r="2.2"/><circle cx="118" cy="41" r="2.2"/></g>
      <text x="150" y="106" text-anchor="end" font-size="10" fill="var(--muted)">rounds T</text>
      <text x="26" y="16" font-size="10" fill="var(--muted)">regret</text>
    </svg>
    <figcaption>Online learning and RL</figcaption>
  </figure>
  <figure class="fig">
    <svg viewBox="0 0 160 110" role="img" aria-label="A flow network with one highlighted route from source to sink">
      <g stroke="var(--accent-line)" stroke-width="1.3" fill="none">
        <line x1="18" y1="55" x2="62" y2="22"/><line x1="18" y1="55" x2="62" y2="88"/><line x1="62" y1="22" x2="108" y2="36"/><line x1="62" y1="55" x2="108" y2="76"/><line x1="62" y1="88" x2="108" y2="76"/><line x1="62" y1="22" x2="62" y2="55"/><line x1="108" y1="76" x2="146" y2="55"/><line x1="108" y1="36" x2="108" y2="76"/>
      </g>
      <polyline fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" points="18,55 62,55 108,36 146,55"/>
      <g fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"><circle cx="62" cy="22" r="5"/><circle cx="62" cy="55" r="5"/><circle cx="62" cy="88" r="5"/><circle cx="108" cy="36" r="5"/><circle cx="108" cy="76" r="5"/></g>
      <g fill="var(--accent)"><circle cx="18" cy="55" r="6"/><circle cx="146" cy="55" r="6"/></g>
    </svg>
    <figcaption>Applications in operations</figcaption>
  </figure>
</div>
